<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Star Catcher</title>
<style>
  :root { --bg: #0b1026; --fg: #f4f1ff; --accent: #ffd34d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 16px; background: rgba(11,16,38,.75); }
  #overlay.hidden { display: none; }
  h1 { font-size: clamp(2rem, 8vw, 4rem); margin: 0 0 .3em; color: var(--accent); letter-spacing: .03em; }
  p { margin: .3em 0; max-width: 32em; line-height: 1.5; }
  button { margin-top: 1em; font: inherit; font-size: 1.2rem; padding: .7em 2em; border: 0; border-radius: 999px;
    background: var(--accent); color: #1a1440; font-weight: 700; cursor: pointer; }
  button:hover { filter: brightness(1.1); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="overlay">
  <h1>Star Catcher</h1>
  <p id="message">Catch the falling stars ⭐ and dodge the rocks 🪨.<br>
    Move with <b>← →</b> / <b>A D</b>, the mouse, or your finger. Press <b>P</b> to pause.</p>
  <button id="start">Play</button>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const message = document.getElementById('message');
const startBtn = document.getElementById('start');

let W, H, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// Background twinkles
const twinkles = Array.from({ length: 120 }, () => ({
  x: Math.random(), y: Math.random(), r: Math.random() * 1.5 + 0.3, p: Math.random() * Math.PI * 2,
}));

function loadBest() { try { return +localStorage.getItem('starCatcherBest') || 0; } catch { return 0; } }
function saveBest(v) { try { localStorage.setItem('starCatcherBest', v); } catch {} }

let state = 'menu'; // menu | playing | paused | over
let player, items, particles, score, lives, level, spawnTimer, best = loadBest();
const keys = {};
let pointerX = null;

function reset() {
  player = { x: W / 2, y: H - 70, w: 90, h: 22, speed: 520 };
  items = []; particles = [];
  score = 0; lives = 3; level = 1; spawnTimer = 0;
}

function spawn() {
  const rockChance = Math.min(0.15 + level * 0.04, 0.45);
  const roll = Math.random();
  let type = 'star';
  if (roll < rockChance) type = 'rock';
  else if (roll > 0.97) type = 'heart';
  const r = type === 'rock' ? 18 + Math.random() * 10 : 16;
  items.push({
    type, r, x: r + Math.random() * (W - 2 * r), y: -r,
    vy: 140 + level * 25 + Math.random() * 60, spin: Math.random() * Math.PI * 2,
  });
}

function burst(x, y, color, n = 14) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 180;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.6, color });
  }
}

function update(dt) {
  // Movement
  let dir = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
  if (dir) { player.x += dir * player.speed * dt; pointerX = null; }
  else if (pointerX !== null) {
    const diff = pointerX - player.x;
    player.x += Math.sign(diff) * Math.min(Math.abs(diff), player.speed * 1.6 * dt);
  }
  player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));
  player.y = H - 70;

  // Spawning
  spawnTimer -= dt;
  if (spawnTimer <= 0) { spawn(); spawnTimer = Math.max(0.25, 0.9 - level * 0.06); }

  // Items
  for (const it of items) {
    it.y += it.vy * dt; it.spin += dt * 2;
    const caught = it.y + it.r > player.y - player.h / 2 && it.y - it.r < player.y + player.h / 2 &&
                   Math.abs(it.x - player.x) < player.w / 2 + it.r * 0.6;
    if (caught) {
      it.dead = true;
      if (it.type === 'star') { score += 10; burst(it.x, it.y, '#ffd34d'); }
      else if (it.type === 'heart') { lives = Math.min(lives + 1, 5); burst(it.x, it.y, '#ff6b9a'); }
      else { lives--; burst(it.x, it.y, '#a08c7a', 24); shake = 0.3; }
    } else if (it.y - it.r > H) {
      it.dead = true;
    }
  }
  items = items.filter(it => !it.dead);

  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);

  level = 1 + Math.floor(score / 100);
  if (lives <= 0) gameOver();
}

let shake = 0;
function drawStar(x, y, r, rot, color) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const rad = i % 2 ? r * 0.45 : r, a = (i * Math.PI) / 5 - Math.PI / 2;
    ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
  }
  ctx.closePath(); ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 15; ctx.fill();
  ctx.restore();
}
function drawHeart(x, y, r) {
  ctx.save(); ctx.translate(x, y); ctx.scale(r / 16, r / 16); ctx.beginPath();
  ctx.moveTo(0, 6); ctx.bezierCurveTo(-16, -6, -8, -18, 0, -8); ctx.bezierCurveTo(8, -18, 16, -6, 0, 6);
  ctx.fillStyle = '#ff6b9a'; ctx.shadowColor = '#ff6b9a'; ctx.shadowBlur = 12; ctx.fill(); ctx.restore();
}
function drawRock(it) {
  ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.spin); ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2, rad = it.r * (0.8 + ((i * 37) % 5) / 20);
    ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
  }
  ctx.closePath(); ctx.fillStyle = '#7d6b5d'; ctx.fill();
  ctx.strokeStyle = '#4e4238'; ctx.lineWidth = 3; ctx.stroke(); ctx.restore();
}

function draw(t) {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * 12 * shake, (Math.random() - 0.5) * 12 * shake);

  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0b1026'); g.addColorStop(1, '#2a1b5c');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);

  for (const s of twinkles) {
    ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t / 900 + s.p));
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  if (player) {
    for (const it of items) {
      if (it.type === 'star') drawStar(it.x, it.y, it.r, it.spin, '#ffd34d');
      else if (it.type === 'heart') drawHeart(it.x, it.y, it.r);
      else drawRock(it);
    }
    for (const p of particles) {
      ctx.globalAlpha = Math.max(p.life / 0.6, 0); ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // Player basket
    const { x, y, w, h } = player;
    ctx.fillStyle = '#7ce0ff'; ctx.shadowColor = '#7ce0ff'; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.roundRect(x - w / 2, y - h / 2, w, h, 10); ctx.fill();
    ctx.shadowBlur = 0;

    // HUD
    ctx.fillStyle = '#f4f1ff'; ctx.font = 'bold 22px system-ui, sans-serif'; ctx.textBaseline = 'top';
    ctx.textAlign = 'left'; ctx.fillText(`Score ${score}`, 16, 16);
    ctx.font = '16px system-ui, sans-serif'; ctx.fillText(`Level ${level}   Best ${best}`, 16, 44);
    ctx.textAlign = 'right'; ctx.font = '22px system-ui, sans-serif';
    ctx.fillText('❤️'.repeat(Math.max(lives, 0)), W - 16, 16);
  }
  ctx.restore();
}

function showOverlay(title, html, button) {
  overlay.querySelector('h1').textContent = title;
  message.innerHTML = html; startBtn.textContent = button;
  overlay.classList.remove('hidden');
}

function start() {
  reset(); state = 'playing'; overlay.classList.add('hidden'); last = performance.now();
}
function gameOver() {
  state = 'over';
  const newBest = score > best;
  if (newBest) { best = score; saveBest(best); }
  showOverlay('Game Over', `You scored <b>${score}</b>${newBest ? ' — a new best! 🎉' : `<br>Best: ${best}`}`, 'Play again');
}
function togglePause() {
  if (state === 'playing') { state = 'paused'; showOverlay('Paused', 'Take a breather.', 'Resume'); }
  else if (state === 'paused') { state = 'playing'; overlay.classList.add('hidden'); last = performance.now(); }
}

startBtn.addEventListener('click', () => (state === 'paused' ? togglePause() : start()));
window.addEventListener('keydown', e => {
  keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true;
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
  if ((e.key === 'Enter' || e.key === ' ') && (state === 'menu' || state === 'over')) start();
});
window.addEventListener('keyup', e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
canvas.addEventListener('pointermove', e => { pointerX = e.clientX; });
canvas.addEventListener('pointerdown', e => { pointerX = e.clientX; });

let last = performance.now();
function loop(t) {
  const dt = Math.min((t - last) / 1000, 0.05); last = t;
  if (state === 'playing') update(dt);
  if (shake > 0) shake -= dt;
  draw(t);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
