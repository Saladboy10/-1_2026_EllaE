<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Level Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@600;800&display=swap">
<style>
  /* Layout: one centered column; game cards in a wrapping grid, upcoming games as dashed empty slots. */
  :root {
    --sky: #8fd3ff;
    --sky-deep: #5fb8f0;
    --ink: #1b1530;
    --paper: #ffffff;
    --signal: #ffcf1a;
    --spray: #ff4f7b;
    --mist: #e9f1fb;
    --display: "Bungee", "Arial Black", Impact, sans-serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { min-height: 100%; }
  body { min-height: 100vh; }
  body { margin: 0; min-height: 100%; color: var(--ink); font-family: var(--body); font-weight: 600;
    background: var(--sky) linear-gradient(180deg, var(--sky) 0%, var(--sky-deep) 100%); }
  html { background: var(--sky-deep); }
  main { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 40px 56px; display: flex; flex-direction: column; gap: 36px; }

  header { display: flex; flex-direction: column; gap: 10px; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2.6rem, 10vw, 4.8rem); line-height: .95; margin: 0;
    color: var(--signal); -webkit-text-stroke: 2px var(--ink); text-shadow: 0 6px 0 var(--ink); text-wrap: balance; }
  .tagline { margin: 0; font-size: 1.15rem; max-width: 40em; }

  h2 { font-family: var(--display); font-weight: 400; font-size: 1.4rem; margin: 0 0 14px; letter-spacing: .02em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }

  .card { background: var(--paper); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 6px 0 var(--ink);
    overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  .card img { display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-bottom: 3px solid var(--ink); background: var(--mist); }
  .card-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .card h3 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; margin: 0; }
  .card p { margin: 0; line-height: 1.45; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; padding: 4px 10px;
    border-radius: 999px; background: var(--mist); border: 2px solid var(--ink); font-variant-numeric: tabular-nums; }
  .pill.best { background: var(--signal); }
  .play { margin-top: auto; display: block; text-align: center; text-decoration: none; color: var(--ink);
    font-family: var(--display); font-size: 1.3rem; padding: 12px 16px; border: 3px solid var(--ink); border-radius: 14px;
    background: var(--signal); box-shadow: 0 4px 0 var(--ink); transition: transform .06s; }
  .play:hover { filter: brightness(1.05); }
  .play:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .play:focus-visible { outline: 3px solid var(--spray); outline-offset: 3px; }

  .slot { border: 3px dashed var(--ink); border-radius: 20px; background: rgba(255,255,255,.35); min-height: 180px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 20px; text-align: center; }
  .slot b { font-family: var(--display); font-weight: 400; font-size: 2.6rem; line-height: 1; opacity: .5; }
  .slot span { font-weight: 800; text-transform: uppercase; letter-spacing: .08em; font-size: .8rem; opacity: .7; }

  @media (prefers-reduced-motion: reduce) { .play { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Level Up</h1>
    <p class="tagline">Pick a game and press Play. More games are on the way.</p>
  </header>

  <section aria-labelledby="games-title">
    <h2 id="games-title">My games</h2>
    <div class="grid">
      <article class="card">
        <img src="assets/rail-rush.jpg" alt="A runner with silver quills racing down train tracks past colorful buildings">
        <div class="card-body">
          <h3>Rail Rush</h3>
          <p>Dodge trains, jump barriers and roll under signs. Collect coins to buy skins, pets and emotes.</p>
          <div class="meta">
            <span class="pill">3D runner</span>
            <span class="pill best" id="best-rail" hidden></span>
          </div>
          <a class="play" href="rail-rush.html">Play</a>
        </div>
      </article>
    </div>
  </section>

  <section aria-labelledby="soon-title">
    <h2 id="soon-title">Coming soon</h2>
    <div class="grid">
      <div class="slot"><b>?</b><span>Next game</span></div>
      <div class="slot"><b>?</b><span>Next game</span></div>
      <div class="slot"><b>?</b><span>Next game</span></div>
    </div>
  </section>
</main>
<script>
  // Show each game's best score, saved by the game itself in this browser.
  function read(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } }
  for (const [id, key] of [['best-rail', 'railrush.best']]) {
    const best = Number(read(key)) || 0;
    if (best > 0) { const el = document.getElementById(id); el.textContent = 'Best ' + best; el.hidden = false; }
  }
</script>
</body>
</html>
